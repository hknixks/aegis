[project]
name = "aegis"
version = "0.1.0"
description = "Autonomous DeFi risk management agent — Phase 1: project scaffold and KeeperHub integration layer"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
