# Fly.io app config for the Aegis dashboard backend (aegis.api).
#
# Deployed at https://aegis-dashboard-backend.fly.dev.
#
# Secrets are NOT set here — this file is committed to git. Set/update
# them with `flyctl secrets set KEY=value -a aegis-dashboard-backend`:
#   - KEEPERHUB_API_KEY (required)
#   - AEGIS_EXPECTED_WALLET_ADDRESS / AEGIS_DEBT_ASSET / AEGIS_COLLATERAL_ASSET
#   - AEGIS_ALLOWED_FRONTEND_ORIGINS — comma-separated, set to the real
#     deployed frontend origin(s) (currently the Vercel production URL);
#     intentionally set as a secret rather than [env] below so it's never
#     silently overridden back to the localhost-only default by a redeploy
#     of this file.
#   - ANTHROPIC_API_KEY (only if AEGIS_HERMES_ENABLED=true)

app = "aegis-dashboard-backend"
primary_region = "iad"

[build]

[env]
  AEGIS_AUDIT_LOG_PATH = "/data/aegis_runs.jsonl"

[[mounts]]
  source = "aegis_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
